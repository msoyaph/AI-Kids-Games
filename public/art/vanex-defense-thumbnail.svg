<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Vanex Defense</title>
  <desc id="d">A glowing crystal castle guarded by a fire tower, with a cute green slime hopping toward it.</desc>
  <defs>
    <radialGradient id="sky" cx="0.4" cy="0.2" r="1">
      <stop offset="0" stop-color="#7a4fe0"/>
      <stop offset="0.5" stop-color="#3b2a9e"/>
      <stop offset="1" stop-color="#1b1446"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8be36f"/>
      <stop offset="1" stop-color="#3fae4a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3defb"/>
      <stop offset="1" stop-color="#a59ddc"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48bff"/>
      <stop offset="1" stop-color="#6a48e8"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset="0.45" stop-color="#7ee8ff"/>
      <stop offset="1" stop-color="#3a8cf0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#bff8ff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#7ee8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ee8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slime" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d4ffc4"/>
      <stop offset="0.45" stop-color="#7be06a"/>
      <stop offset="1" stop-color="#3f9e36"/>
    </radialGradient>
    <radialGradient id="fireOrb" cx="0.4" cy="0.6" r="0.7">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#cfc9e8"/>
      <stop offset="1" stop-color="#6a6487"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.2" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#cdbdff"/>
      <stop offset="1" stop-color="#ff9be6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1b0a4a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="0" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.85">
    <path d="M 70 70 l 3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
    <path d="M 440 120 l 2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
    <circle cx="120" cy="160" r="2"/><circle cx="400" cy="40" r="2.5"/><circle cx="470" cy="210" r="2"/>
  </g>
  <path d="M0 360 C 120 320 260 340 360 330 C 430 322 480 300 512 300 L512 512 L0 512 Z" fill="url(#hill)"/>
  <path d="M -20 470 C 100 440 200 420 300 420 C 360 420 400 400 430 380" fill="none" stroke="#b88d52" stroke-width="54" stroke-linecap="round"/>
  <path d="M -20 470 C 100 440 200 420 300 420 C 360 420 400 400 430 380" fill="none" stroke="#f0d29a" stroke-width="42" stroke-linecap="round"/>

  <!-- castle -->
  <g filter="url(#soft)" transform="translate(360 250)">
    <ellipse cx="0" cy="30" rx="150" ry="140" fill="url(#glow)"/>
    <rect x="-80" y="0" width="160" height="110" rx="12" fill="url(#stone)" stroke="#3b2f7a" stroke-width="5"/>
    <path d="M -20 110 L -20 74 A 20 20 0 0 1 20 74 L 20 110 Z" fill="#6a4ac8" stroke="#3b2f7a" stroke-width="4"/>
    <rect x="-110" y="-50" width="50" height="160" rx="10" fill="url(#stone)" stroke="#3b2f7a" stroke-width="5"/>
    <rect x="60" y="-50" width="50" height="160" rx="10" fill="url(#stone)" stroke="#3b2f7a" stroke-width="5"/>
    <path d="M -118 -46 L -85 -100 L -52 -46 Z" fill="url(#roof)" stroke="#3b2f7a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 52 -46 L 85 -100 L 118 -46 Z" fill="url(#roof)" stroke="#3b2f7a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 0 -96 L 34 -66 L 22 -12 L -22 -12 L -34 -66 Z" fill="url(#gem)" stroke="#1a4a8a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M -34 -66 L 0 -46 L 34 -66 M 0 -46 L 0 -12" fill="none" stroke="#e8fdff" stroke-width="2.5"/>
  </g>

  <!-- flame tower -->
  <g transform="translate(150 330)" filter="url(#soft)">
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="url(#plate)" stroke="#3a3456" stroke-width="5"/>
    <circle r="31" fill="#c45a3a" stroke="#7a2a12" stroke-width="4"/>
    <circle r="54" fill="url(#glow)" opacity="0.6"/>
    <path d="M 0 -40 C 13 -20 32 -11 24 9 C 19 28 -19 28 -24 9 C -30 -6 -13 -13 -9 -24 C -6 -15 -4 -28 0 -40 Z" fill="url(#fireOrb)" stroke="#9c2a0c" stroke-width="4"/>
  </g>

  <!-- slime -->
  <g transform="translate(250 430)" filter="url(#soft)">
    <path d="M -44 24 C -48 -6 -26 -38 0 -38 C 26 -38 48 -6 44 24 Q 0 38 -44 24 Z" fill="url(#slime)" stroke="#2a6a24" stroke-width="5"/>
    <ellipse cx="-17" cy="-21" rx="11" ry="6" fill="#fff" opacity="0.7"/>
    <ellipse cx="-11" cy="-4" rx="8" ry="9" fill="#fff" stroke="#21123d" stroke-width="2"/>
    <ellipse cx="11" cy="-4" rx="8" ry="9" fill="#fff" stroke="#21123d" stroke-width="2"/>
    <ellipse cx="-10" cy="-2.5" rx="4.6" ry="5.2" fill="#21123d"/>
    <ellipse cx="12" cy="-2.5" rx="4.6" ry="5.2" fill="#21123d"/>
    <circle cx="-12" cy="-5.5" r="1.9" fill="#fff"/><circle cx="10" cy="-5.5" r="1.9" fill="#fff"/>
    <path d="M -6 9 Q 0 14 6 9" fill="none" stroke="#21123d" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <g filter="url(#soft)" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', 'Verdana', sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="96" font-size="86" fill="#2a1a66" stroke="#2a1a66" stroke-width="18" stroke-linejoin="round">Vanex</text>
    <text x="256" y="96" font-size="86" fill="url(#title)">Vanex</text>
    <text x="256" y="168" font-size="64" fill="#2a1a66" stroke="#2a1a66" stroke-width="16" stroke-linejoin="round">Defense</text>
    <text x="256" y="168" font-size="64" fill="url(#title)">Defense</text>
  </g>
</svg>
