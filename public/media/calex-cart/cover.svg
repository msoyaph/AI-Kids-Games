    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b47a44"/><stop offset="1" stop-color="#c88a50"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
