name: Game listing request
description: Register interest in listing your kid-safe game on AI Kids Games (coming soon).
title: "[Listing] "
labels: [listing-request]
body:
  - type: markdown
    attributes:
      value: |
        **Listing games on AI Kids Games is coming soon.** This form lets you get in line; we'll reply here when listings open.
        The website never collects any data, which is why requests live here on GitHub.
        Please don't include personal information about yourself or any child. Link to your game's public source code instead.
  - type: input
    id: title
    attributes:
      label: Game title
      description: An original name, not another company's title or trademark.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source code
      placeholder: https://github.com/you/your-game
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: What is it?
      description: Genre, ages, what players do, and which devices and controls it supports.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: The game contract
      description: Listed games must meet all of these. See CONTRIBUTING.md and docs/CREATE-A-GAME.md.
      options:
        - label: One self-contained HTML file that works offline and inside a sandboxed iframe.
          required: true
        - label: No network requests, ads, purchases, loot boxes, accounts, chat or tracking.
          required: true
        - label: Every saved key uses the game's own storage prefix; no clearing or touching other keys.
          required: true
        - label: Original work only, with no other companies' characters, names, art, music or trademarks.
          required: true
        - label: Age-appropriate content with honest content notes, and flashing at or under 3 per second.
          required: true
        - label: I am 13 or older (GitHub's rule) and have the right to submit this game.
          required: true
