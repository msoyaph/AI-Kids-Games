name: GPU e2e (self-hosted Mac)

# Runs the browser tests at normal quality on a real GPU (Metal) on your own Mac, then the
# performance benchmark. See docs/CI.md for setting up the runner.
#
# SAFETY: this workflow never runs for pull requests, only for pushes to these two branches or
# when started by hand. Self-hosted runners must only be used with a PRIVATE repository.
on:
  push:
    branches: [main, lightcrossing-upgrade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-e2e
  cancel-in-progress: false

jobs:
  gpu:
    # Refuse to use the self-hosted machine if the repository is ever made public.
    if: github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64, gpu]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build the single file
        run: npm run build

      - name: Build is under 2 MB
        run: npm run size

      - name: Browser smoke test (normal quality, Metal GPU)
        run: npm run e2e

      - name: Performance benchmark (Low, Medium, High)
        run: npm run bench -- --out bench-results.json
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload the test report and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-gpu
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
