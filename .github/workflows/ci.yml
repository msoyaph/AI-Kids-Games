name: CI

# Standard GitHub-hosted runner (no GPU). The browser smoke test runs at Low quality on
# SwiftShader (software WebGL), with longer timeouts. The full-quality GPU run is gpu-e2e.yml.
on:
  push:
    branches: [main, lightcrossing-upgrade]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pull requests only run when they come from a branch of this repository, never from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the single file
        run: npm run build

      - name: Build is under 2 MB
        run: npm run size

      - name: Unit tests (includes a full story playthrough)
        run: npm test

      - name: Story pacing stays near 6 hours
        run: npm run pacing -- --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (Low quality, software WebGL)
        run: npm run e2e
        env:
          E2E_LOW: '1'

      - name: Upload the test report and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
