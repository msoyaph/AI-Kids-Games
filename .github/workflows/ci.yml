# Runs on GitHub's Ubuntu machines for every push and pull request.
# Software WebGL there is slow, so Playwright gets longer timeouts and pages
# report a low-end device (Auto quality → Low); see playwright.config.ts.
# The real-GPU checks (flash audit sampling, perf benchmark) run on the
# self-hosted Mac workflow instead.
name: CI

on:
  push:
    branches: [main, vanex-upgrade]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + balance sims
        run: npm test

      - name: Build single-file game
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Dist checks (size, file:// + http, no requests)
        run: npm run check:dist

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
