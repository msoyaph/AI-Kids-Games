# Cliff Valley CI — standard GitHub-hosted runners.
# Typecheck, unit tests, headless bot playthrough + pacing model, single-file build (size and
# no-external-requests check), then Playwright on desktop/tablet/phone. The browser tests run
# in low-quality mode (?lowq=1) with software WebGL, so no GPU is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Bot playthrough + pacing model
        run: npm run test:sim

      - name: Build single file (≤ 2.5 MB, self-contained)
        run: npm run build:only

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (desktop / tablet / phone, file://, sandboxed iframe)
        run: npm run test:e2e

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cliff-valley-reports
          path: |
            reports/
            playwright-report/
            test-results/
            dist/index.html
          retention-days: 14
