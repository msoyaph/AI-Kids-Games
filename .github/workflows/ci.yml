# Ai Kids Games CI. GitHub's standard Ubuntu runners only: self-hosted runners must never be used
# with this public repository (scripts/check-repo.ts fails the build if one ever appears).
#
# The repo checks and the website always run. Each game (and the starter template) runs its own
# typecheck, unit tests, build and browser tests only when its folder or shared files change,
# in the game's low-quality test mode on software WebGL. "CI passed" is the one required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.pick.outputs.games }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: pick
        name: Pick the games to test
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          all='["theabonk","light-crossing","vanex-defense","space-sky","calex-cart","cliff-valley","game-starter"]'
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "games=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$changed" | grep -qE '^(package\.json|package-lock\.json|\.nvmrc|scripts/|\.github/workflows/ci\.yml)'; then
            echo "games=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          picked=$(echo "$changed" | sed -nE 's#^games/([a-z0-9-]+)/.*#\1#p; s#^templates/(game-starter)/.*#\1#p' | sort -u | jq -R . | jq -cs .)
          echo "games=${picked:-[]}" >> "$GITHUB_OUTPUT"

  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck the repo tooling
        run: npm run typecheck
      - name: Typecheck the sizzle reel tooling
        run: npm run typecheck --workspace marketing/sizzle
      - name: No files over 10 MB, no local paths, no self-hosted runners
        run: npm run check:repo
      - name: Every game's committed build matches its source
        run: npm run check:builds
      - name: Manifests valid and generated files up to date
        run: npm run manifests -- --check
      - name: Storage scan of the committed builds
        run: npm run audit-storage
      - name: Secret scan of the whole history (gitleaks 8.30.1, checksum verified)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test --workspace apps/site
      - name: Build (deployment guard, registry validation, typecheck, route shells)
        run: npm run build --workspace apps/site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop, tablet, phone; the GPU play-throughs run locally before each release)
        run: npm run test:e2e --workspace apps/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright
          path: apps/site/test-results/
          retention-days: 14
          if-no-files-found: ignore

  game:
    name: ${{ matrix.game }}
    needs: changes
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    env:
      CI: 'true'
      # each game's own low-quality mode for software WebGL
      E2E_LOW: '1'
      CALEX_TESTMODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Checks
        working-directory: ${{ matrix.game == 'game-starter' && 'templates/game-starter' || format('games/{0}', matrix.game) }}
        run: |
          case "${{ matrix.game }}" in
            theabonk)       npm run typecheck && npm test && npm run build ;;
            light-crossing) npm run typecheck && npm run build && npm run size && npm test && npm run pacing -- --check ;;
            vanex-defense)  npm run typecheck && npm test && npm run build ;;
            space-sky)      npm run typecheck && npm test && npm run build ;;
            calex-cart)     npm run typecheck && npm run build && npm test && npm run validate ;;
            cliff-valley)   npm run typecheck && npm test && npm run test:sim && npm run build:only ;;
            game-starter)   npm run typecheck && npm test && npm run build ;;
          esac
      - name: Install browsers
        working-directory: ${{ matrix.game == 'game-starter' && 'templates/game-starter' || format('games/{0}', matrix.game) }}
        run: |
          case "${{ matrix.game }}" in
            light-crossing|calex-cart) npx playwright install --with-deps chromium webkit ;;
            *)                         npx playwright install --with-deps chromium ;;
          esac
      - name: Browser tests (low quality, software WebGL)
        working-directory: ${{ matrix.game == 'game-starter' && 'templates/game-starter' || format('games/{0}', matrix.game) }}
        run: |
          case "${{ matrix.game }}" in
            light-crossing) npm run e2e:ci ;;
            vanex-defense)  npm run check:dist && npx playwright test ;;
            cliff-valley)   npm run test:e2e ;;
            *)              npx playwright test ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.game }}
          path: |
            games/${{ matrix.game }}/test-results/
            templates/game-starter/test-results/
          retention-days: 14
          if-no-files-found: ignore

  passed:
    name: CI passed
    needs: [changes, checks, site, game]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "a required job ended with: $result"; exit 1 ;; esac
          done
