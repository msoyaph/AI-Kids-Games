# AI Kids Games CI. GitHub's standard Ubuntu runners only: self-hosted runners must never be used
# with this public repository (scripts/check-repo.ts fails the build if one ever appears).
#
# The repo checks, the website and the MCP app (apps/mcp) always run. Each game (and the starter
# template) runs its own typecheck, unit tests, build and browser tests only when its folder or
# shared files change (.github/scripts/what-changed.mjs), in the game's low-quality test mode on
# software WebGL.
# Space Sky's and Light Crossing's browser suites need a real GPU, so they run on the release
# machine instead (npm run release:local), and the production guard requires that recorded run.
# Community games (community/<slug>/, SUBMITTING.md): a pull request that touches community/ may
# change only that one game's folder, every commit must be signed off (DCO), and
# npm run check-submission must pass. Fork code runs here only under pull_request, with the
# read-only token below and no secrets; never pull_request_target. Slugs are validated before
# they reach a job, and reach shells only through env.
# "CI passed" is the one required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.pick.outputs.games }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: pick
        name: Pick the games to test
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node .github/scripts/what-changed.mjs >> "$GITHUB_OUTPUT"

  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck the repo tooling
        run: npm run typecheck
      - name: Tests of the CI game picker
        run: node --test ".github/scripts/*.test.mjs"
      - name: No files over 10 MB, no local paths, no self-hosted runners
        run: npm run check:repo
      - name: Every game's committed build matches its source
        run: npm run check:builds
      - name: Manifests valid and generated files up to date
        run: npm run manifests -- --check
      - name: Storage scan of the committed builds
        run: npm run audit-storage
      - name: Secret scan of the whole history (gitleaks 8.30.1, checksum verified)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      # Two fixture community games (one submitted, one unlisted), so the Community shelf and the
      # separate play origin are tested; the live site's builds read community/ instead.
      AIKG_COMMUNITY_ROOT: apps/site/tests/fixtures/community
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test --workspace apps/site
      - name: Build (deployment guard, registry validation, typecheck, route shells)
        run: npm run build --workspace apps/site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop, tablet, phone; the GPU play-throughs run locally before each release)
        run: npm run test:e2e --workspace apps/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright
          path: apps/site/test-results/
          retention-days: 14
          if-no-files-found: ignore

  mcp:
    name: MCP app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck and unit tests
        run: npm run typecheck --workspace apps/mcp && npm test --workspace apps/mcp
      - name: Build (production gate, widget, function)
        run: npm run build --workspace apps/mcp
      - name: MCP Inspector checks (tools, calls, widget resources; both protocol eras)
        run: npm run inspect --workspace apps/mcp
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: The widget in a host-like sandbox (a light game inline, a heavy one fullscreen)
        run: npm run test:e2e --workspace apps/mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mcp-playwright
          path: apps/mcp/test-results/
          retention-days: 14
          if-no-files-found: ignore

  game:
    name: ${{ matrix.game }}
    needs: changes
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    env:
      CI: 'true'
      # each game's own low-quality mode for software WebGL
      E2E_LOW: '1'
      CALEX_TESTMODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Checks
        working-directory: ${{ matrix.game == 'game-starter' && 'templates/game-starter' || format('games/{0}', matrix.game) }}
        env:
          GAME: ${{ matrix.game }}
        run: |
          case "$GAME" in
            theabonk)       npm run typecheck && npm test && npm run build ;;
            light-crossing) npm run typecheck && npm run build && npm run size && npm test && npm run pacing -- --check ;;
            vanex-defense)  npm run typecheck && npm test && npm run build ;;
            space-sky)      npm run typecheck && npm test && npm run build ;;
            calex-cart)     npm run typecheck && npm run build && npm test && npm run validate ;;
            cliff-valley)   npm run typecheck && npm test && npm run test:sim && npm run build:only ;;
            *)              npm run typecheck && npm test && npm run build ;;
          esac
      - name: Install browsers
        if: matrix.game != 'space-sky' && matrix.game != 'light-crossing'
        working-directory: ${{ matrix.game == 'game-starter' && 'templates/game-starter' || format('games/{0}', matrix.game) }}
        env:
          GAME: ${{ matrix.game }}
        run: |
          case "$GAME" in
            theabonk|vanex-defense|cliff-valley|game-starter) npx playwright install --with-deps chromium ;;
            *) npx playwright install --with-deps chromium webkit ;; # calex-cart, and new games test Safari's engine too
          esac
      - name: Browser tests (low quality, software WebGL)
        if: matrix.game != 'space-sky' && matrix.game != 'light-crossing'
        working-directory: ${{ matrix.game == 'game-starter' && 'templates/game-starter' || format('games/{0}', matrix.game) }}
        env:
          GAME: ${{ matrix.game }}
        run: |
          case "$GAME" in
            vanex-defense)  npm run check:dist && npx playwright test ;;
            cliff-valley)   npm run test:e2e ;;
            *)              npx playwright test ;;
          esac
      - name: Browser tests on the release machine
        if: matrix.game == 'space-sky' || matrix.game == 'light-crossing'
        run: echo "This suite needs a real GPU. It runs before each release with npm run release:local, recorded in apps/site/DEPLOYMENT.json (localSuites)."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.game }}
          path: |
            games/${{ matrix.game }}/test-results/
            templates/game-starter/test-results/
          retention-days: 14
          if-no-files-found: ignore

  community:
    name: Community scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slugs: ${{ steps.scope.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Which community games this pull request changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          # The owner's approval pull requests: a branch of this repository, opened by its owner.
          OWNER: ${{ github.event.pull_request.author_association == 'OWNER' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: node .github/scripts/community-scope.mjs >> "$GITHUB_OUTPUT"
      - name: A community pull request changes only its own folder
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          OWNER: ${{ github.event.pull_request.author_association == 'OWNER' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: node .github/scripts/community-scope.mjs --strict > /dev/null
      - name: Every commit is signed off (DCO)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.scope.outputs.slugs != '[]' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/dco.mjs

  submission:
    name: Submission ${{ matrix.slug }}
    needs: community
    # Runs even when the scope check fails, so a creator sees every problem with their game at once.
    if: ${{ !cancelled() && needs.community.outputs.slugs != '' && needs.community.outputs.slugs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.community.outputs.slugs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: npm run check-submission
        env:
          SLUG: ${{ matrix.slug }}
        run: npm run check-submission -- "$SLUG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: submission-${{ matrix.slug }}
          path: community/*/.check/report.*
          retention-days: 14
          if-no-files-found: ignore

  passed:
    name: CI passed
    needs: [changes, checks, site, mcp, game, community, submission]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "a required job ended with: $result"; exit 1 ;; esac
          done
