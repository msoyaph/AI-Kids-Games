name: GPU (self-hosted Mac)

# Full-quality suite on YOUR Mac (real GPU via ANGLE/Metal): e2e on every project, the audio
# report and the in-browser benchmark. Read docs/CI.md before enabling this.
#
# Security: this job only runs when you start it by hand or push to your own branches —
# never for pull requests (a pull request from someone else could otherwise run code on
# your machine).
on:
  workflow_dispatch:
  push:
    branches: [main, theabonk-upgrade]

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality:
    # only on this repository's own pushes / manual runs, never on forks
    if: github.repository_owner == github.actor || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run check-size
      - run: npm test
      - name: Playwright, every project, full quality on the real GPU
        run: npx playwright test
      - name: Audio report (loudness / peaks)
        run: npm run audio-report
      - name: In-browser benchmark matrix
        run: npm run bench-browser -- 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
