<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Calex Cart</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#8a6bff"/>
      <stop offset="0.55" stop-color="#4b33c4"/>
      <stop offset="1" stop-color="#1d1250"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c7086"/>
      <stop offset="1" stop-color="#4a4e5c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- sunburst -->
  <g opacity="0.18" fill="#ffffff">
    <path d="M800 340 L0 0 L260 0Z"/><path d="M800 340 L520 0 L760 0Z"/><path d="M800 340 L1000 0 L1240 0Z"/>
    <path d="M800 340 L1500 0 L1600 120Z"/><path d="M800 340 L1600 420 L1600 620Z"/><path d="M800 340 L0 380 L0 600Z"/><path d="M800 340 L0 120 L0 0 L60 0Z"/>
  </g>
  <!-- hills -->
  <path d="M0 610 Q200 520 420 600 T860 590 T1260 570 T1600 600 V900 H0Z" fill="#4fbf4a"/>
  <path d="M0 650 Q260 590 520 660 T1040 650 T1600 640 V900 H0Z" fill="#6ccf5a"/>
  <!-- road -->
  <path d="M560 900 L760 620 L840 620 L1040 900Z" fill="url(#road)"/>
  <path d="M790 640 L810 640 L816 700 L784 700Z M778 740 L822 740 L832 830 L768 830Z" fill="#fff"/>
  <path d="M560 900 L760 620 L748 620 L536 900Z" fill="#ff4d6d"/>
  <path d="M1040 900 L840 620 L852 620 L1064 900Z" fill="#ff4d6d"/>
  <!-- confetti -->
  <g>
    <rect x="160" y="210" width="22" height="12" rx="3" fill="#ffd23f" transform="rotate(20 170 215)"/>
    <rect x="1380" y="250" width="22" height="12" rx="3" fill="#4ce0d2" transform="rotate(-25 1390 255)"/>
    <rect x="1260" y="140" width="18" height="10" rx="3" fill="#ff6fae" transform="rotate(35 1270 145)"/>
    <rect x="300" y="120" width="18" height="10" rx="3" fill="#8cff6b" transform="rotate(-15 310 125)"/>
    <circle cx="1460" cy="420" r="9" fill="#ffd23f"/><circle cx="130" cy="430" r="9" fill="#ff6fae"/>
    <circle cx="1180" cy="300" r="7" fill="#8cff6b"/><circle cx="420" cy="300" r="7" fill="#4ce0d2"/>
  </g>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="250" y1="690" x2="470" y2="690"/><line x1="180" y1="740" x2="440" y2="740"/><line x1="280" y1="790" x2="460" y2="790"/>
  </g>
  <!-- kart -->
  <g transform="translate(800 720)">
    <ellipse cx="0" cy="118" rx="230" ry="26" fill="#000" opacity="0.25"/>
    <rect x="-200" y="20" width="400" height="80" rx="26" fill="#ff4d6d" stroke="#1d1250" stroke-width="8"/>
    <path d="M-170 30 L-120 -20 L120 -20 L170 30Z" fill="#ff6f8a" stroke="#1d1250" stroke-width="8" stroke-linejoin="round"/>
    <rect x="-150" y="50" width="300" height="22" rx="10" fill="#ffd23f"/>
    <circle cx="-150" cy="100" r="46" fill="#26262e" stroke="#1d1250" stroke-width="6"/><circle cx="-150" cy="100" r="18" fill="#c0c8d8"/>
    <circle cx="150" cy="100" r="46" fill="#26262e" stroke="#1d1250" stroke-width="6"/><circle cx="150" cy="100" r="18" fill="#c0c8d8"/>
    <circle cx="-110" cy="52" r="14" fill="#fff6b0"/><circle cx="110" cy="52" r="14" fill="#fff6b0"/>
    <!-- driver -->
    <rect x="-56" y="-110" width="112" height="100" rx="40" fill="#3fa7ff" stroke="#1d1250" stroke-width="7"/>
    <circle cx="0" cy="-160" r="66" fill="#ffd2a1" stroke="#1d1250" stroke-width="7"/>
    <path d="M-70 -175 Q0 -250 70 -175 Z" fill="#ff4d6d" stroke="#1d1250" stroke-width="7" stroke-linejoin="round"/>
    <rect x="-10" y="-186" width="96" height="18" rx="8" fill="#ff4d6d" stroke="#1d1250" stroke-width="6"/>
    <ellipse cx="-22" cy="-158" rx="9" ry="13" fill="#1d1250"/><ellipse cx="24" cy="-158" rx="9" ry="13" fill="#1d1250"/>
    <path d="M-22 -128 Q0 -110 22 -128" stroke="#1d1250" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-46" cy="-136" r="9" fill="#ff9fb0" opacity="0.8"/><circle cx="46" cy="-136" r="9" fill="#ff9fb0" opacity="0.8"/>
    <!-- sparks -->
    <g fill="#ff4dd2"><path d="M-240 80 l-34 -10 l24 -8 l-30 -22 l36 14z"/><path d="M240 80 l34 -10 l-24 -8 l30 -22 l-36 14z"/></g>
  </g>
  <!-- logo -->
  <g font-family="'Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif" font-weight="900" text-anchor="middle">
    <text x="800" y="250" font-size="190" fill="#1d1250" dy="12" letter-spacing="8">CALEX CART</text>
    <text x="800" y="250" font-size="190" letter-spacing="8" stroke="#1d1250" stroke-width="10" paint-order="stroke">
      <tspan fill="#ffd23f">C</tspan><tspan fill="#4ce0d2">A</tspan><tspan fill="#ff6fae">L</tspan><tspan fill="#8cff6b">E</tspan><tspan fill="#ffd23f">X</tspan><tspan fill="#fff"> </tspan><tspan fill="#ff6fae">C</tspan><tspan fill="#8cff6b">A</tspan><tspan fill="#4ce0d2">R</tspan><tspan fill="#ffd23f">T</tspan>
    </text>
    <text x="800" y="330" font-size="48" fill="#ffffff" stroke="#1d1250" stroke-width="6" paint-order="stroke">Drift · Boost · Glide · Race!</text>
  </g>
</svg>
