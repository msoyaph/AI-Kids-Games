d`,does:`Critters get stuck in its fluffy plumes.`}],Ee=[{id:`snail`,name:`Snack Snail`,animal:`Garden snail`,mechanic:`walker`,world:`meadow`,tip:`Slow and steady. Any plant can shoo it.`},{id:`mouse`,name:`Field Mouse`,animal:`Field mouse`,mechanic:`quick`,world:`meadow`,tip:`Quick! Slow it down with soft or sticky plants.`},{id:`ants`,name:`Ant Column`,animal:`Ants`,mechanic:`swarm`,world:`meadow`,tip:`A line of tiny ants. Area plants shoo lots at once.`},{id:`roly-poly`,name:`Roly-poly`,animal:`Pill bug`,mechanic:`armored`,world:`meadow`,tip:`Curls into its shell when hit. Keep the pressure on.`},{id:`magpie`,name:`Magpie`,animal:`Magpie`,mechanic:`flyer`,also:`swapper`,world:`meadow`,tip:`Borrows a plant and drops it farther down. Replant it, or reach it with lobbers.`},{id:`beetle`,name:`Leaf-shield Beetle`,animal:`Stag beetle`,mechanic:`shield`,world:`greenhouse`,tip:`Holds a leaf in front. Lob over it or pop through it.`},{id:`grasshopper`,name:`Grasshopper`,animal:`Grasshopper`,mechanic:`jumper`,world:`greenhouse`,tip:`Hops in bursts, right over plants. Tangle or soften its landing.`},{id:`frog`,name:`Umbrella Frog`,animal:`Tree frog`,mechanic:`lob-blocker`,world:`greenhouse`,tip:`Its leaf umbrella stops lobs. Shoot it straight on.`},{id:`vole`,name:`Vole`,animal:`Vole`,mechanic:`digger`,world:`greenhouse`,tip:`A molehill shows where it will pop up. Be ready there.`},{id:`hedgehog`,name:`Hedgehog`,animal:`Hedgehog`,mechanic:`armored`,world:`dusk`,tip:`Its spines stop straight shots from the front. Lobs work.`},{id:`moths`,name:`Moth Flutter`,animal:`Moths`,mechanic:`swarm`,also:`flyer`,world:`dusk`,tip:`Moths fly to lanterns. Use that to lead them.`},{id:`badger`,name:`Badger`,animal:`Badger`,mechanic:`shield`,world:`dusk`,tip:`Carries a big tin lid. Wear it down, or go over it.`},{id:`owlet`,name:`Owlet`,animal:`Little owl`,mechanic:`flyer`,world:`dusk`,tip:`Swoops low past lanterns, where lobbers can reach it.`},{id:`gecko`,name:`Desert Gecko`,animal:`Gec  spots a lantern.`,gecko:`Loves warm tiles. The hotter the ground, the faster its little feet go.`,goat:`Will try a nibble of absolutely anything. Especially your plants.`,jackrabbit:`Two great big hops and it is halfway across the garden.`,packrat:`Likes to swap things. It will trade your plant for a nice shiny pebble.`,seagull:`Spots a picnic from the sky and dives straight for one snack.`,"kite-crow":`Flies its kite on the breeze and rides the updrafts over the clouds.`,sheep:`So fluffy it floats right over the gaps in the Cloud Garden.`},De=[{id:`grand-snail`,name:`The Grand Snail`,world:`meadow`,profile:`The biggest, slowest snail in the meadow, with ants who come when it calls.`,tip:`Lots of shooters in its lane, and something for the ants it calls.`},{id:`big-beetle`,name:`The Big Beetle`,world:`greenhouse`,profile:`Hides behind an enormous leaf and sometimes charges forward.`,tip:`Lob over the leaf, or pierce right through it.`},{id:`badger-baron`,name:`The Badger Baron`,world:`dusk`,profile:`A very grand badger in a bow tie. Digs over to a new lane now and then.`,tip:`Keep shooters ready in more than one lane.`},{id:`billy-goat`,name:`Billy the Goat`,world:`desert`,profile:`Nibbles fast and butts plants back a tile when it is in a hurry.`,tip:`Tough blockers buy time while your shooters work.`},{id:`captain-gull`,name:`Captain Gull`,world:`cloud`,profile:`The captain of the seagulls, diving fast for the picnic.`,tip:`Bluebells and lobbers reach it up in the air.`},{id:`parade-float`,name:`The Snack Parade Float`,world:`cloud`,profile:`Every critter in the land, riding a giant float with a cake on top!`,tip:`It is slow but very tough, and it drops critters off as it goes. Fill its lane with shooters.`}],I=e=>Ee.find(t=>t.id===e)?.tip??De.find(t=>t.id===e)?.tip??``,L=e=>Ee.find(t=>t.id===e)?.name??De.find(t=>t.id===e)?.name??e,Oe={comfrey:`Comfrey has big, hairy leaves that are full of goodness. Gardeners add them to compost to help other plants grow.`,rowan:`Rowan trees, also called mountain ash, grow bunches of bright red berries in autumn. Birds like thrushes love to eat them.`,boxwood:`Boxwood is a slow-growing evergreen shrub. Gardeners have clipped it into hedges and shapes, called topiary, for hundreds of years.`,"lambs-ear":`Lamb's ear leaves are covered in soft silver hairs, so they feel just like a lamb's ear.`,maple:`Maple seeds have wings. They spin like little helicopters as they fall, so the wind can carry them away from the tree.`,basil:`Basil is a herb grown for its tasty leaves. Gardeners often grow it next to tomatoes.`,lavender:`Lavender has a strong, sweet smell. Bees love it, and its scent keeps some insects, like clothes moths, away.`,arrowhead:`Arrowhead grows in ponds and ditches. Its leaves are shaped like arrowheads, and ducks eat its little round roots.`,pickerelweed:`Pickerelweed grows at the edges of ponds, with tall spikes of blue-purple flowers that bees and butterflies visit.`,wisteria:`Wisteria is a climbing vine with long hanging bunches of flowers. Its seed pods can burst open with a pop and fling their seeds.`,yarrow:`Yarrow has flat-topped clusters of tiny flowers. Gardeners add its leaves to compost to help it break down faster.`,"touch-me-not":`Touch-me-not, also called jewelweed, has ripe seed pods that burst open when you touch them, shooting their seeds away. That's how it got its name.`,primrose:`Evening primrose flowers open in the evening, sometimes fast enough to watch them unfold. Moths visit them at night.`,"four-oclock":`Four o'clock flowers open in the late afternoon, around four o'clock, and close again the next morning.`,"hop-vine":`Hops are climbing plants whose stems twist around poles and strings as they grow. Their flowers look like little papery green cones.`,allium:`Ornamental alliums are cousins of onions and garlic. Each round flower head is made of lots of tiny star-shaped flowers.`,nasturtium:`Gardeners plant nasturtiums as a "trap crop": pests like aphids go for the nasturtiums and leave other plants alone. Their flowers are good to eat, too.`,agave:`Agave plants store water in their thick leaves, so they can live through long dry spells in the desert.`,hollyhock:`Hollyhocks can grow taller than a grown-up, with flowers stacked all the way up the stem. Their seeds are flat and round, like little coins.`,chamomile:`Chamomile has small daisy-like flowers that smell a bit like apples. Some gardeners call it "the plant doctor".`,milkweed:`Milkweed is the only food monarch butterfly caterpillars eat. Its pods split open to let out seeds on silky white fluff that floats on the wind.`,bluebell:`In spring, bluebells cover some woodlands with nodding blue bell-shaped flowers. Some bluebell woods are hundreds of years old.`,borage:`Borage has star-shaped flowers that bees adore, so gardeners grow it to bring more bees to their gardens.`,pampas:`Pampas grass comes from the grasslands of South America. It grows tall, feathery plumes.`},ke={comfrey:`Garden Friends: next to a Rowan, its leaves feed the tree, so the Rowan shoos harder. Next to Yarrow, both make richer compost.`,rowan:`Garden Friends: next to Comfrey it shoos harder; next to Allium, too.`,yarrow:`Garden Friends: next to Comfrey, both make richer compost. It also makes more compost the more neighbours it has.`,nasturtium:`Garden Friends: critters nibble its neighbours more slowly, because it draws them away.`,chamomile:`Garden Friends: the plants around it slowly mend. It also makes every card recharge sooner.`,borage:`Garden Friends: its bees help flowering neighbours (Maple, Hollyhock, Lavender, Bluebell) act faster, and it makes every Garden Friends bonus around it bigger.`,allium:`Garden Friends: Rowan, Wisteria and Milkweed next to it shoo harder.`,basil:`It helps the plants around it work faster.`,wisteria:`Garden Friends: next to Allium, it shoos harder.`,milkweed:`Garden Friends: next to Allium, it shoos harder.`,maple:`Garden Friends: with Borage next door, it         <button class="big" data-go="map" type="button">Play</button>

        <button data-go="challenges" type="button">Challenges</button>
        <button data-go="daily" type="button">Daily Garden</button>
        <button data-go="books" type="button">Books</button>

      <div class="chosen" aria-live="polite"></div>
      <div class="offer"></div>
      <footer><button class="pick" type="button">Pick for me</button><button class="big go" type="button">Let's grow!</button></footer>
    </section>

      <div class="menu">
        <button id="resume" class="big" type="button">Keep playing</button>

      <h2 id="result-title"></h2>
      <div class="stars" aria-hidden="true"></div>
      <p class="message"></p>
      <div class="unlock"></div>
      <div class="menu"></div>
    </section>

    <section id="books" class="screen panel" hidden aria-labelledby="books-title">
      <header><button class="round back" data-back type="button" aria-label="Back">‹</button><h2 id="books-title">Books</h2></header>
      <div class="tabs" role="tablist" aria-label="Books"><button role="tab" data-book="seeds" type="button">Seed Book</button><button role="tab" data-book="critters" type="button">Invader Book</button></div>
      <div class="pages"><div class="grid"></div><article class="page" aria-live="polite"></article></div>
    </section>

    <section id="settings" class="screen panel" hidden aria-labelledby="settings-title">
      <header><button class="round back" data-back type="button" aria-label="Back">‹</button><h2 id="settings-title">Settings</h2></header>
      <form class="options" onsubmit="return false">
        <label>Music <input type="range" name="music" min="0" max="1" step="0.1" /></label>
        <label>Sounds <input type="range" name="sfx" min="0" max="1" step="0.1" /></label>
        <label class="check"><input type="checkbox" name="autoCollect" /> Collect compost by itself</label>
        <label class="check"><input type="checkbox" name="fast" /> Start levels at double speed</label>
        <label class="check"><input type="checkbox" name="patterns" /> Patterns for colourblind players</label>
        <label class="check"><input type="checkbox" name="reducedMotion" /> Less motion</label>
        <label class="check"><input type="checkbox" name="largeText" /> Bigger text</label>
        <label class="check"><input type="checkbox" name="readAloud" /> Read tips aloud</label>
        <label>Graphics <select name="quality"><option value="auto">Automatic</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
        <button type="button" class="danger" id="start-over">Start over (forget my progress)</button>
      </form>
    </section>

    <section id="tip" class="screen" hidden role="dialog" aria-modal="true" aria-labelledby="tip-title">
      <div class="card-panel"><img alt="" /><h2 id="tip-title"></h2><p></p><div class="menu"><button class="big ok" type="button">Got it!</button><button class="say" type="button" aria-label="Read aloud">🔊</button></div></div>
    </section>

    <div id="rotate" hidden role="alert"><div class="phone" aria-hidden="true"></div><p>Turn your phone sideways to play</p></div>
    <script>
      // The garden needs WebGL 2. Check before the game loads, note which graphics chip draws it (a
      // software renderer starts on Low at 1×), and show a friendly screen when it's missing.
      // Adapted from Space Sky's index.html.
      (function () {
        var ok = false;
        try {
          var c = document.createElement('canvas');
          var gl = window.WebGL2RenderingContext ? c.getContext('webgl2') : null;
          ok = !!gl;
          if (gl) {
            var info = gl.getExtension('WEBGL_debug_renderer_info');
            window.__gardenGpu = String(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
          }
          var lose = gl && gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        } catch (e) { ok = false; }
        if (ok) return;
        window.__noWebGL2 = true;
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        var box = document.createElement('div');
        box.id = 'nogl';
        box.setAttribute('role', 'alert');
        box.setAttribute('data-testid', 'no-webgl');
        box.innerHTML =
          '<svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="96" rx="40" ry="10" fill="#8f6440"/>' +
          '<path d="M60 94 C60 70 58 56 60 40" stroke="#3f8a42" stroke-width="6" fill="none" stroke-linecap="round"/>' +
          '<path d="M60 62 C44 60 34 48 34 36 C48 38 58 48 60 62 Z M60 52 C74 48 84 38 86 26 C72 28 62 38 60 52 Z" fill="#6cbc58"/>' +
          '<circle cx="54" cy="80" r="3" fill="#2a1d17"/><circle cx="66" cy="80" r="3" fill="#2a1d17"/></svg>' +
          '<h1>This device can’t grow the garden</h1>' +
          '<p>Shooberry needs 3D graphics (WebGL 2), and this browser can’t do that right now.</p>' +
          '<p>Try a different browser, or ask a grown-up to update this device.</p>' +
          '<button type="button" onclick="location.reload()">Try again</button>';
        document.body.appendChild(box);
      })();
    </script>
  </body>
</html>
