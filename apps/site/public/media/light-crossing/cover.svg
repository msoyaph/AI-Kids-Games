     <rect x="1320" y="482" width="9" height="28" fill="#8b6a48"/><path d="M1324 430l30 28-5 34h-50l-5-34z" fill="#7cba73"/><path d="M1324 430l30 28-5 34h-25z" fill="#64a463"/></g>
