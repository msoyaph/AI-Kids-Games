  <g><rect x="772" y="470" width="10" height="34" fill="#8b6a48"/><path d="M777 404l38 34-6 44h-64l-6-44z" fill="#6fae6a"/><path d="M777 404l38 34-6 44h-32z" fill="#5b9c5c"/>
