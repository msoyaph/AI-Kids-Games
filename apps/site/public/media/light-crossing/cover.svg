<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Light Crossing cover: Driftlight Isle on festival night. Colors from the game (palette.ts, buildings.ts, character.ts, sky.ts). Safe area: top 22% and side 6% are background only. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f6fbd"/>
      <stop offset=".5" stop-color="#d9a2cb"/>
      <stop offset=".85" stop-color="#ffd3b0"/>
      <stop offset="1" stop-color="#ffe6c4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc9c4"/>
      <stop offset="1" stop-color="#5aa3a6"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff2b8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff2b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b8"/><stop offset=".4" stop-color="#ffd27a" stop-opacity=".7"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <radialGradient id="held" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe2a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffc27a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- lighthouse beam sweeping left -->
  <path d="M1168 262 300 160v190z" fill="url(#beam)" opacity=".8"/>
  <!-- sea -->
  <rect y="480" width="1600" height="420" fill="url(#sea)"/>
  <path d="M0 520h420l-140 30zM900 506h360l-120 22zM120 640l300-20-100 40zM1240 660l300-24-80 50zM300 800l340-30-120 60z" fill="#a8dad3" opacity=".6"/>
  <path d="M0 860 420 820 300 900H0zM1600 820l-380 40 60 40h320z" fill="#4c9598" opacity=".6"/>
  <!-- island -->
  <path d="M620 560 760 470 980 444 1210 452 1380 500 1440 560 1360 600 1100 618 820 612z" fill="#e6bf86"/>
  <path d="M640 548 770 470 980 444 1200 452 1360 500 1410 548 1100 586 840 584z" fill="#f2d3a0"/>
  <path d="M700 520 800 462 990 440 1190 446 1320 488 1350 520 1120 548 860 548z" fill="#9ed18b"/>
  <path d="M800 462 990 440l-60 70zM1190 446l130 42-150 20z" fill="#b2dd9c"/><path d="M860 548l140-50 120 50zM1240 530l110-10-100 24z" fill="#86c27a"/>
