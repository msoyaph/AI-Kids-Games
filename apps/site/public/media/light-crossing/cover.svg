    <circle cx="598" cy="578" r="7" fill="#3b2f4a"/><circle cx="634" cy="578" r="7" fill="#3b2f4a"/><circle cx="600" cy="575" r="2.5" fill="#fff"/><circle cx="636" cy="575" r="2.5" fill="#fff"/>
    <ellipse cx="584" cy="596" rx="10" ry="6" fill="#ff9aa5" opacity=".6"/><ellipse cx="648" cy="596" rx="10" ry="6" fill="#ff9aa5" opacity=".6"/>
    <path d="M608 598q8 7 16 0" fill="none" stroke="#3b2f4a" stroke-width="3.5" stroke-linecap="round"/>
