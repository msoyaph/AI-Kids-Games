  <g>
    <rect x="596" y="690" width="16" height="44" rx="7" fill="#5b4a6a"/><rect x="620" y="690" width="16" height="44" rx="7" fill="#5b4a6a"/>
    <path d="M584 616h64l14 82h-92z" fill="#a9e3a1"/><path d="M584 616h32v82h-46z" fill="#bdeeb4"/>
    <path d="M648 626 682 590" stroke="#a9e3a1" stroke-width="18" stroke-linecap="round"/><circle cx="686" cy="584" r="11" fill="#f7d0aa"/>
    <path d="M586 628 566 676" stroke="#94d18c" stroke-width="18" stroke-linecap="round"/><circle cx="564" cy="682" r="11" fill="#eec29a"/>
    <circle cx="616" cy="566" r="56" fill="#f7d0aa"/>
    <path d="M560 560a56 56 0 0 1 112 0c-14-8-30-12-56-12s-42 4-56 12z" fill="#f1d27a"/><path d="M560 560a56 56 0 0 1 56-56v44c-26 0-42 4-56 12z" fill="#f7df98"/>
