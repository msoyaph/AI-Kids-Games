    <circle cx="700" cy="560" r="46" fill="url(#held)"/>
    <path d="M686 538h28l6 40h-40z" fill="#ffc27a"/><path d="M686 538h14v40h-20z" fill="#ffd9a3"/><rect x="684" y="532" width="32" height="8" rx="3" fill="#b77a48"/><path d="M700 532v-8" stroke="#8b6a48" stroke-width="3"/>
