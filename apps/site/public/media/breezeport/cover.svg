<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<!-- Breezeport cover: the seaside town on a sunny morning. City Hall with its clock in the middle, pastel clapboard houses and shops along the street, the coral tram and the teal bus, the Ferris wheel by the boardwalk, and the striped lighthouse on its islet out in the bay. Colors from the game. No text. Safe area: top 22% and side 6% are background only. -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86cdf5"/><stop offset=".6" stop-color="#c6e9fb"/><stop offset="1" stop-color="#e6f6fb"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0"/><stop offset=".4" stop-color="#ffeeb0" stop-opacity=".8"/><stop offset="1" stop-color="#ffeeb0" stop-opacity="0"/></radialGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab8d6"/><stop offset="1" stop-color="#2f8fb3"/></linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b0"/><stop offset="1" stop-color="#e9cf92"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd06a"/><stop offset="1" stop-color="#5fae4e"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6672"/><stop offset="1" stop-color="#47505b"/></linearGradient>
<g id="tree"><rect x="-6" y="-8" width="12" height="34" rx="4" fill="#8a5a3b"/><circle cx="0" cy="-30" r="34" fill="#5fae5a"/><circle cx="-14" cy="-38" r="20" fill="#78c26a"/><path d="M0 -64 A34 34 0 0 1 34 -30 L0 -30Z" fill="#4c9a4c" opacity=".55"/></g>
<g id="window"><rect x="-13" y="-17" width="26" height="34" rx="3" fill="#ffffff"/><rect x="-10" y="-14" width="20" height="28" rx="2" fill="#8fc6dc"/><path d="M0 -14v28M-10 0h20" stroke="#ffffff" stroke-width="3"/></g>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1330" cy="120" r="160" fill="url(#sun)"/>
<circle cx="1330" cy="120" r="52" fill="#fff6c8"/>
<!-- far hills across the bay -->
<path d="M0 330 C180 280 330 300 470 320 C640 286 820 270 1010 300 C1190 276 1380 286 1600 316 V380 H0Z" fill="#a8d8b8"/>
<path d="M0 352 C220 320 420 340 620 348 C820 326 1050 330 1250 344 C1400 334 1500 340 1600 346 V390 H0Z" fill="#8ccaa6"/>
