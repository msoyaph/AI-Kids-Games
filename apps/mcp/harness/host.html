<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Apps test host</title>
<style>
  html, body { margin: 0; font: 15px/1.4 system-ui, sans-serif; }
  body { padding: 16px; background: #f4f4f5; }
  body.dark { background: #1d1d20; color: #eee; }
  #chat { max-width: 760px; margin: 0 auto; }
  .bubble { padding: 10px 14px; border-radius: 14px; background: #fff; margin-bottom: 12px; }

  #proxy { display: block; width: 100%; height: 200px; border: 0; }
  #proxy.fullscreen { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 10; background: #000; }
</style>
