<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd0ff" />
    <title>Farm WIP</title>
    <style>
      /* boot and "no 3D" cards: inline so they show before the game's code loads */
      html, body { margin: 0; height: 100%; background: linear-gradient(#8fd0ff, #e8f6ff); }
      .early { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
        color: #36342b; font: 700 18px/1.4 ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Varela Round", system-ui, sans-serif; }
      .early h1 { margin: 0; font-size: 34px; }
      .early p { margin: 0; max-width: 30em; }
      .early button { font: inherit; min-height: 52px; padding: 0 28px; border: 0; border-radius: 16px; background: #ffd166; color: #36342b; box-shadow: 0 5px 0 #e0a92e; cursor: pointer; }
      #boot .sprout { width: 84px; height: 84px; animation: bob 1.1s ease-in-out infinite alternate; }
      @keyframes bob { to { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { #boot .sprout { animation: none; } }
      #boot.done { opacity: 0; transition: opacity .4s; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot" class="early" role="status" aria-live="polite">
      <svg class="sprout" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11" stroke="#5aa64a" stroke-width="2.6" stroke-linecap="round"/><path d="M12 12c-5 0-7-3-7-7 4 0 7 2 7 7z" fill="#7cc95a"/><path d="M12 10c0-4 2.5-6.5 7-6.5 0 4.5-3 6.5-7 6.5z" fill="#9ad874"/><ellipse cx="12" cy="21.5" rx="6" ry="1.6" fill="#9c7552"/></svg>
      <p>Waking up the farm…</p>
    </div>
    <canvas id="farm" aria-label="The farm, seen from above. Tap a tile to use it."></canvas>
    <div id="ui"></div>
    <script>
      // The farm needs WebGL 2 (3D graphics). Check before the game loads, and show a friendly card
      // if this device can't draw it. (Pattern from Space Sky's index.html.)
      (function () {
        var ok = false;
        try {
          var c = document.createElement('canvas');
          var gl = window.WebGL2RenderingContext ? c.getContext('webgl2') : null;
          ok = !!gl;
          var lose = gl && gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        } catch (e) { ok = false; }
        if (ok) return;
        window.__noWebGL2 = true;
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        var box = document.createElement('div');
        box.className = 'early';
        box.id = 'nogl';
        box.setAttribute('role', 'alert');
        box.setAttribute('data-testid', 'no-webgl');
        box.innerHTML =
          '<svg viewBox="0 0 24 24" width="96" height="96" aria-hidden="true"><path d="M3.5 20.5V11L12 4.5l8.5 6.5v9.5z" fill="#e25c4a"/><rect x="9.3" y="13.5" width="5.4" height="7" rx="1" fill="#fff2d6"/><path d="M3 11.3L12 4.3l9 7" fill="none" stroke="#fff" stroke-width="1.4"/></svg>' +
          '<h1>This device can’t show the farm</h1>' +
          '<p>The farm is drawn in 3D (WebGL 2), and this browser can’t do that right now.</p>' +
          '<p>Try another browser, or ask a grown-up to update this device. Then come back and farm!</p>' +
          '<button type="button" onclick="location.reload()">Try again</button>';
        document.body.appendChild(box);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
