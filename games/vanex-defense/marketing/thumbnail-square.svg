<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Vanex Defense</title>
  <desc id="d">A glowing crystal citadel spire ringed by six element colours on a dark tech grid.</desc>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1d2d55"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ee6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset="0.45" stop-color="#7ff3ff"/>
      <stop offset="1" stop-color="#1aa6c8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6b8f"/>
      <stop offset="1" stop-color="#232d48"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2a3a5c" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  <rect width="512" height="512" rx="48" fill="url(#grid)"/>
  <circle cx="256" cy="230" r="190" fill="url(#glow)"/>
  <!-- element ring -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M256 70 A160 160 0 0 1 394 150" stroke="#ff7a3d"/>
    <path d="M405 172 A160 160 0 0 1 405 288" stroke="#3ec8ff"/>
    <path d="M394 310 A160 160 0 0 1 270 390" stroke="#3fd77a"/>
    <path d="M242 390 A160 160 0 0 1 118 310" stroke="#ffc845"/>
    <path d="M107 288 A160 160 0 0 1 107 172" stroke="#b07cff"/>
    <path d="M118 150 A160 160 0 0 1 242 70" stroke="#c98a4a"/>
  </g>
  <!-- citadel -->
  <path d="M166 420 L186 368 L326 368 L346 420 Z" fill="url(#metal)" stroke="#0a0f1d" stroke-width="5"/>
  <path d="M196 368 L210 310 L302 310 L316 368 Z" fill="#1b2542" stroke="#0a0f1d" stroke-width="5"/>
  <path d="M256 92 L294 186 L280 310 L232 310 L218 186 Z" fill="url(#spire)" stroke="#0a3b4a" stroke-width="5"/>
  <path d="M256 92 L294 186 L256 206 Z" fill="#ffffff" opacity="0.45"/>
  <path d="M205 210 L222 246 L214 310 L194 310 L188 246 Z" fill="url(#spire)" stroke="#0a3b4a" stroke-width="4"/>
  <path d="M307 210 L324 246 L318 310 L298 310 L290 246 Z" fill="url(#spire)" stroke="#0a3b4a" stroke-width="4"/>
  <ellipse cx="256" cy="398" rx="118" ry="20" fill="none" stroke="#3ee6ff" stroke-width="4" opacity="0.6"/>
  <text x="256" y="474" text-anchor="middle" font-family="'Avenir Next Condensed','Bahnschrift','DIN Alternate','Roboto Condensed','Arial Narrow',system-ui,sans-serif" font-size="54" font-weight="800" letter-spacing="4" fill="#ffffff">VANEX</text>
</svg>
