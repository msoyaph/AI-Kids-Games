<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#86cdf5" />
    <title>Breezeport</title>
    <style>
      /* boot and "no 3D" cards: inline so they show before the game's code loads (pattern from Fieldlark) */
      html, body { margin: 0; height: 100%; background: linear-gradient(#86cdf5, #e6f6fb); }
      .early { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
        color: #2f3a44; font: 700 18px/1.4 ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Varela Round", system-ui, sans-serif; }
      .early h1 { margin: 0; font-size: 34px; }
      .early p { margin: 0; max-width: 30em; }
      .early button { font: inherit; min-height: 52px; padding: 0 28px; border: 0; border-radius: 16px; background: #ff9b85; color: #2f3a44; box-shadow: 0 5px 0 #e0705a; cursor: pointer; }
      #boot .house { width: 84px; height: 84px; animation: bob 1.1s ease-in-out infinite alternate; }
      @keyframes bob { to { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { #boot .house { animation: none; } }
      #boot.done { opacity: 0; transition: opacity .4s; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot" class="early" role="status" aria-live="polite">
      <svg class="house" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5V11l8-6 8 6v9.5z" fill="#a6dccb"/><path d="M2.8 11.6L12 4.4l9.2 7.2" fill="none" stroke="#ef6a55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="14" width="4" height="6.5" rx="1" fill="#2fa3b0"/><rect x="5.5" y="12.5" width="3" height="3" rx=".6" fill="#fff"/><rect x="15.5" y="12.5" width="3" height="3" rx=".6" fill="#fff"/></svg>
      <p>Opening the town…</p>
    </div>
    <canvas id="town" aria-label="The town, seen from above. Tap a tile to use it."></canvas>
    <div id="ui"></div>
    <script>
      // The town needs WebGL 2 (3D graphics). Check before the game loads, and show a friendly card
      // if this device can't draw it. (Pattern from Space Sky's and Fieldlark's index.html.)
      (function () {
        var ok = false;
        try {
          var c = document.createElement('canvas');
          var gl = window.WebGL2RenderingContext ? c.getContext('webgl2') : null;
          ok = !!gl;
          var lose = gl && gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        } catch (e) { ok = false; }
        if (ok) return;
        window.__noWebGL2 = true;
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        var box = document.createElement('div');
        box.className = 'early';
        box.id = 'nogl';
        box.setAttribute('role', 'alert');
        box.setAttribute('data-testid', 'no-webgl');
        box.innerHTML =
          '<h1>This device can’t show the town</h1>' +
          '<p>The town is drawn in 3D (WebGL 2), and this browser can’t do that right now.</p>' +
          '<p>Try another browser, or ask a grown-up to update this device. Then come back and build!</p>' +
          '<button type="button" onclick="location.reload()">Try again</button>';
        document.body.appendChild(box);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
