<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shooberry</title>
  </head>
  <body>
    <div id="boot" role="status"><div class="sprout" aria-hidden="true"></div><p>Growing the garden…</p></div>
    <canvas id="game" aria-label="The picnic garden: five garden beds in front of a picnic blanket"></canvas>
    <div id="hud" hidden>
      <div id="topbar">
        <div id="compost" class="chip" role="status" aria-label="Compost: 85">
          <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="22" r="11" fill="#5e3a22" stroke="#2b1910" stroke-width="2.5"/><path d="M20 21c-7 0-12-4-13-9 6 0 11 3 13 9zM20 21c7 0 12-4 13-9-6 0-11 3-13 9z" fill="#8fe05a" stroke="#2b1910" stroke-width="2.2" stroke-linejoin="round"/><path d="M20 12v-6m0 3c-2-3-5-3-6-2m6 2c2-3 5-3 6-2" stroke="#2b1910" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="16" cy="26" r="1.6" fill="#8a5a35"/><circle cx="24" cy="25" r="1.4" fill="#8a5a35"/></svg>
          <b id="compost-count">85</b>
        </div>
        <div id="waves" role="progressbar" aria-label="Wave progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55">
          <div class="track"><div class="fill" style="width:55%"></div><div class="head" style="left:55%"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="22" r="13" fill="#ff9a6c" stroke="#2b1910" stroke-width="3"/><path d="M14 10c-2-5-6-6-8-5M26 10c2-5 6-6 8-5" stroke="#2b1910" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="15" cy="20" r="4.5" fill="#fff" stroke="#2b1910" stroke-width="2"/><circle cx="25" cy="20" r="4.5" fill="#fff" stroke="#2b1910" stroke-width="2"/><circle cx="14" cy="20.5" r="2.2" fill="#1d1410"/><circle cx="24" cy="20.5" r="2.2" fill="#1d1410"/><path d="M15 28c3 3 7 3 10 0" stroke="#2b1910" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div></div>
          <span class="flag" style="left:50%" aria-hidden="true"></span><span class="flag big" style="left:100%" aria-hidden="true"></span>
        </div>
        <button id="speed" class="round" type="button" aria-label="Speed: normal" aria-pressed="false">1×</button>
        <button id="pause-button" class="round" type="button" aria-label="Pause">❚❚</button>
      </div>
      <div id="cards" role="radiogroup" aria-label="Plants"></div>
    </div>
    <section id="title" class="screen" hidden>
      <h1>Shooberry</h1>
      <p>Plant friendly helpers and shoo the critters away from the picnic!</p>
      <button id="play" class="big" type="button">Play</button>
      <button id="sound" type="button" aria-pressed="true">Sound: on</button>
      <p id="storage-note" class="note" hidden>This browser can't save progress, so settings last until you close the game.</p>
    </section>
    <section id="paused" class="screen" hidden>
      <h2>Paused</h2>
      <button id="resume" class="big" type="button">Keep playing</button>
    </section>
    <div id="rotate" hidden role="alert"><div class="phone" aria-hidden="true"></div><p>Turn your phone sideways to play</p></div>
    <script>
      // The garden needs WebGL 2. Check before the game loads, note which graphics chip draws it (a
      // software renderer starts on Low at 1×), and show a friendly screen when it's missing.
      // Adapted from Space Sky's index.html.
      (function () {
        var ok = false;
        try {
          var c = document.createElement('canvas');
          var gl = window.WebGL2RenderingContext ? c.getContext('webgl2') : null;
          ok = !!gl;
          if (gl) {
            var info = gl.getExtension('WEBGL_debug_renderer_info');
            window.__gardenGpu = String(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
          }
          var lose = gl && gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        } catch (e) { ok = false; }
        if (ok) return;
        window.__noWebGL2 = true;
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        var box = document.createElement('div');
        box.id = 'nogl';
        box.setAttribute('role', 'alert');
        box.setAttribute('data-testid', 'no-webgl');
        box.innerHTML =
          '<svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="96" rx="40" ry="10" fill="#8f6440"/>' +
          '<path d="M60 94 C60 70 58 56 60 40" stroke="#3f8a42" stroke-width="6" fill="none" stroke-linecap="round"/>' +
          '<path d="M60 62 C44 60 34 48 34 36 C48 38 58 48 60 62 Z M60 52 C74 48 84 38 86 26 C72 28 62 38 60 52 Z" fill="#6cbc58"/>' +
          '<circle cx="54" cy="80" r="3" fill="#2a1d17"/><circle cx="66" cy="80" r="3" fill="#2a1d17"/></svg>' +
          '<h1>This device can’t grow the garden</h1>' +
          '<p>The garden needs 3D graphics (WebGL 2), and this browser can’t do that right now.</p>' +
          '<p>Try a different browser, or ask a grown-up to update this device.</p>' +
          '<button type="button" onclick="location.reload()">Try again</button>';
        document.body.appendChild(box);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
