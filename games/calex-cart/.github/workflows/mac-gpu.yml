# Calex Cart — OPTIONAL full-quality browser tests on your own Mac (real Metal GPU).
#
# ⚠️  WARNING — READ BEFORE ENABLING
#   • Use this ONLY with a PRIVATE repository. A self-hosted runner executes the workflow's code directly on
#     your Mac, with your user account's access to your files, network and keychain.
#   • Untrusted pull requests must NEVER be able to run code on your machine. This workflow therefore:
#       – never runs on `pull_request` / `pull_request_target` (only on a manual "Run workflow" click, or a
#         push to `main` / `calex-upgrade` by someone who already has write access);
#       – refuses to start unless the repository is private and the run was started by the repository owner.
#     Also set, in GitHub → Settings → Actions → General:
#       – "Fork pull request workflows": require approval for ALL outside collaborators;
#       – do not add outside collaborators with write access to this repository.
#   • If the repository ever becomes public: remove the runner first
#     (GitHub → Settings → Actions → Runners → … → Remove) and delete this file.
#
# Setup steps are in README.md → "Continuous integration" → "Optional: full-quality tests on your Mac".
name: Mac GPU (self-hosted)

on:
  workflow_dispatch:
  push:
    branches: [main, calex-upgrade]

permissions:
  contents: read

concurrency:
  group: mac-gpu
  cancel-in-progress: true

jobs:
  gpu-tests:
    # private repo + started by the owner only; the runner needs the extra `calex-mac` label you give it
    if: github.event.repository.private == true && github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, calex-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + build (fails over 2 MB)
        run: npm run build

      - name: Unit + simulation tests
        run: npm test

      - name: Browser tests at full quality (Metal GPU)
        run: |
          npx playwright install chromium webkit
          npx playwright test

      - name: Benchmark (Low / Medium / High on the heaviest track, 30 s each)
        continue-on-error: true
        run: |
          mkdir -p sim-report
          npx vite preview --port 4173 --strictPort &
          sleep 3
          for q in low medium high; do npm run bench -- --quality $q --seconds 30 --json sim-report/bench-$q.json; done
          npm run bench -- --quality medium --seconds 30 --profile tablet --json sim-report/bench-tablet-medium.json
          kill %1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-gpu-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            sim-report/bench*.json
          retention-days: 14
