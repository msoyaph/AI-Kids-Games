# ─────────────────────────────────────────────────────────────────────────────────────────────
# ⚠️  OPTIONAL — self-hosted Mac runner (real GPU) for the performance benchmark.
#
#     ONLY USE THIS WITH A PRIVATE REPOSITORY.
#
#     A self-hosted runner executes workflow code on your own machine. On a public repository,
#     anyone could open a pull request that changes a workflow and run code on your Mac.
#     This workflow therefore:
#       • runs only when started by hand (workflow_dispatch) — never on pull requests,
#       • refuses to run if the repository is public (the `if:` below),
#       • asks for read-only repository permissions.
#     Set up the runner with the labels `self-hosted` and `macOS` (Settings → Actions → Runners).
# ─────────────────────────────────────────────────────────────────────────────────────────────
name: GPU benchmark (self-hosted Mac)

on:
  workflow_dispatch:
    inputs:
      cpu_throttle:
        description: CPU throttle for the tablet/phone profiles
        default: '4'

permissions:
  contents: read

jobs:
  gpu-bench:
    if: ${{ github.event.repository.private }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Benchmark on the Mac GPU (Metal)
        run: node scripts/perf.mjs --gpu --cpu=${{ inputs.cpu_throttle }}

      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-benchmark
          path: |
            reports/bench.json
            playwright-report/
          retention-days: 30
