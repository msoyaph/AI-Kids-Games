<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Garden Defense (working title)</title>
  </head>
  <body>
    <div id="boot" role="status"><div class="sprout" aria-hidden="true"></div><p>Growing the garden…</p></div>
    <canvas id="game" aria-label="The picnic garden: five garden beds in front of a picnic blanket"></canvas>
    <div id="hud" hidden>
      <div id="topbar">
        <div id="compost" class="chip" role="status" aria-label="Compost: 125">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 25c2-6 7-9 13-9s11 3 13 9z" fill="#6f4a2e"/><circle cx="10" cy="22" r="2" fill="#8f6440"/><circle cx="19" cy="20" r="2.4" fill="#5e3d26"/><circle cx="24" cy="23" r="1.6" fill="#8f6440"/><path d="M16 16c0-6 4-10 10-11-1 6-4 10-10 11z" fill="#6cbc58"/><path d="M16 16c2-3 5-6 8-8" stroke="#3f8a42" stroke-width="1.3" fill="none"/></svg>
          <b id="compost-count">125</b>
        </div>
        <div id="waves" role="img" aria-label="Wave progress: the critters are a third of the way along">
          <svg viewBox="0 0 220 28" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <path d="M8 18 H212" stroke="#d8c7a3" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
            <g fill="#8f6440"><ellipse cx="200" cy="18" rx="4" ry="3"/><ellipse cx="184" cy="14" rx="4" ry="3"/><ellipse cx="168" cy="18" rx="4" ry="3"/><ellipse cx="152" cy="14" rx="4" ry="3"/></g>
            <g fill="#cbb994"><ellipse cx="136" cy="18" rx="4" ry="3"/><ellipse cx="120" cy="14" rx="4" ry="3"/><ellipse cx="104" cy="18" rx="4" ry="3"/><ellipse cx="88" cy="14" rx="4" ry="3"/><ellipse cx="56" cy="18" rx="4" ry="3"/><ellipse cx="40" cy="14" rx="4" ry="3"/><ellipse cx="24" cy="18" rx="4" ry="3"/></g>
            <g><path d="M72 22 V4" stroke="#7a5236" stroke-width="2"/><path d="M73 4 h12 l-4 4 l4 4 h-12z" fill="#e9504a"/><path d="M73 6 h4 v4 h-4z" fill="#fdf6ea"/></g>
            <g><path d="M12 22 V2" stroke="#7a5236" stroke-width="2"/><path d="M13 2 h14 l-4 5 l4 5 h-14z" fill="#e9504a"/><path d="M13 4 h5 v5 h-5z M22 4 h3 v5 h-3z" fill="#fdf6ea"/></g>
          </svg>
        </div>
        <button id="speed" class="round" type="button" aria-label="Speed: normal" aria-pressed="false">1×</button>
        <button id="pause-button" class="round" type="button" aria-label="Pause">❚❚</button>
      </div>
      <div id="cards" role="radiogroup" aria-label="Plants"></div>
    </div>
    <section id="title" class="screen" hidden>
      <h1>Garden Defense (working title)</h1>
      <p>Plant friendly helpers and shoo the critters away from the picnic!</p>
      <button id="play" class="big" type="button">Play</button>
      <button id="sound" type="button" aria-pressed="true">Sound: on</button>
      <p id="storage-note" class="note" hidden>This browser can't save progress, so settings last until you close the game.</p>
    </section>
    <section id="paused" class="screen" hidden>
      <h2>Paused</h2>
      <button id="resume" class="big" type="button">Keep playing</button>
    </section>
    <div id="rotate" hidden role="alert"><div class="phone" aria-hidden="true"></div><p>Turn your phone sideways to play</p></div>
    <script>
      // The garden needs WebGL 2. Check before the game loads, note which graphics chip draws it (a
      // software renderer starts on Low at 1×), and show a friendly screen when it's missing.
      // Adapted from Space Sky's index.html.
      (function () {
        var ok = false;
        try {
          var c = document.createElement('canvas');
          var gl = window.WebGL2RenderingContext ? c.getContext('webgl2') : null;
          ok = !!gl;
          if (gl) {
            var info = gl.getExtension('WEBGL_debug_renderer_info');
            window.__gardenGpu = String(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
          }
          var lose = gl && gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        } catch (e) { ok = false; }
        if (ok) return;
        window.__noWebGL2 = true;
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
        var box = document.createElement('div');
        box.id = 'nogl';
        box.setAttribute('role', 'alert');
        box.setAttribute('data-testid', 'no-webgl');
        box.innerHTML =
          '<svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="96" rx="40" ry="10" fill="#8f6440"/>' +
          '<path d="M60 94 C60 70 58 56 60 40" stroke="#3f8a42" stroke-width="6" fill="none" stroke-linecap="round"/>' +
          '<path d="M60 62 C44 60 34 48 34 36 C48 38 58 48 60 62 Z M60 52 C74 48 84 38 86 26 C72 28 62 38 60 52 Z" fill="#6cbc58"/>' +
          '<circle cx="54" cy="80" r="3" fill="#2a1d17"/><circle cx="66" cy="80" r="3" fill="#2a1d17"/></svg>' +
          '<h1>This device can’t grow the garden</h1>' +
          '<p>The garden needs 3D graphics (WebGL 2), and this browser can’t do that right now.</p>' +
          '<p>Try a different browser, or ask a grown-up to update this device.</p>' +
          '<button type="button" onclick="location.reload()">Try again</button>';
        document.body.appendChild(box);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
