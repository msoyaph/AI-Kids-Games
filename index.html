<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Vanex Defense — build elemental towers and protect the crystal kingdom!" />
    <title>Vanex Defense</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #e8f0ff;
        font-family: 'Avenir Next Condensed', 'Bahnschrift', 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;
        background:
          radial-gradient(ellipse at 50% 30%, #1b2a4d 0%, transparent 60%),
          linear-gradient(180deg, #0e1528, #070b16);
        z-index: 100;
        transition: opacity 0.4s ease;
      }
      #boot .gem {
        width: 46px;
        height: 64px;
        background: linear-gradient(135deg, #e8fdff, #3ee6ff 45%, #7a6bff);
        clip-path: polygon(50% 0, 100% 30%, 82% 100%, 18% 100%, 0 30%);
        animation: bob 1.2s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 16px #3ee6ff);
      }
      #boot h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #boot .bar {
        width: min(280px, 70vw);
        height: 6px;
        background: #18223a;
        overflow: hidden;
      }
      #boot .fill {
        height: 100%;
        width: 4%;
        background: linear-gradient(90deg, #3ee6ff, #7a6bff);
        box-shadow: 0 0 12px #3ee6ff;
        transition: width 0.15s ease;
      }
      #boot .tip {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9fb0cf;
        min-height: 20px;
        padding: 0 20px;
        text-align: center;
      }
      @keyframes bob {
        from {
          transform: translateY(-5px);
        }
        to {
          transform: translateY(5px);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="gem"></div>
      <h1>Vanex Defense</h1>
      <div class="bar"><div class="fill" id="boot-fill"></div></div>
      <div class="tip" id="boot-tip">Calibrating the grid…</div>
    </div>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
