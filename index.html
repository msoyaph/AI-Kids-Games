<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1446" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Vanex Defense — build elemental towers and protect the crystal kingdom!" />
    <title>Vanex Defense</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1446;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #fff;
        font-family: ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
        background: radial-gradient(ellipse at 50% 35%, #4b2f9e 0%, #1b1446 70%);
        z-index: 100;
        transition: opacity 0.4s ease;
      }
      #boot .gem {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #8ff3ff, #7a5cff 55%, #ff7ad9);
        clip-path: polygon(50% 0, 100% 38%, 80% 100%, 20% 100%, 0 38%);
        animation: bob 1.1s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 14px #9b8bff);
      }
      #boot h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 1px;
        text-shadow: 0 3px 0 #2a1a66;
      }
      #boot .bar {
        width: min(260px, 70vw);
        height: 14px;
        border-radius: 7px;
        background: #2a1f63;
        box-shadow: inset 0 2px 4px #0006;
        overflow: hidden;
      }
      #boot .fill {
        height: 100%;
        width: 4%;
        border-radius: 7px;
        background: linear-gradient(90deg, #7ef0ff, #b48cff);
        transition: width 0.15s ease;
      }
      #boot .tip {
        font-size: 15px;
        opacity: 0.85;
        min-height: 20px;
        padding: 0 20px;
        text-align: center;
      }
      @keyframes bob {
        from {
          transform: translateY(-6px) rotate(-4deg);
        }
        to {
          transform: translateY(6px) rotate(4deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="gem"></div>
      <h1>Vanex Defense</h1>
      <div class="bar"><div class="fill" id="boot-fill"></div></div>
      <div class="tip" id="boot-tip">Polishing the crystals…</div>
    </div>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
